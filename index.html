<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="./style.css">
  
  <title>Frontend Mentor | NFT preview card component</title>

</head>
<body>

  <main class="card">

    <section class="card-img-section">

      <div class="card-main-img">
        <img src="./images/image-equilibrium.jpg" alt="Image of a cube">
      </div>
      
      <div class="card-view-container">
        <div class="card-view-icon">
          <img src="./images/icon-view.svg" alt="View Icon">
        </div>
        <div class="card-img-bkg"></div>
      </div>

    </section>

    <section class="card-text">

      <h1>Equilibrium #3429</h1>

      <p class="card-desc">
        Our Equilibrium collection promotes balance and calm.
      </p>

      <div class="eth-countdown">
        <div class="eth-icon-price">
          <div class="eth-icon">
            <img src="./images/icon-ethereum.svg" alt="Ethereum Icon">
          </div>
          <p class="eth-price">0.041 ETH</p>
        </div>

        <div class="countdown">
          <div class="clock-icon">
            <img src="./images/icon-clock.svg" alt="Clock Icon">
          </div>
          <p class="countdown-time">3 days left</p>
        </div>

      </div>
    </section>

    <hr>

    <section class="card-profile-section">
     
      <div class="card-profile-img">
        <img src="./images/image-avatar.png" alt="Avatar image">
      </div>

      <p class="card-profile-desc">
        Creation of <span><a href="#" class="card-profile-name">Jules Wyvern</a></span>
      </p>

    </section>

  </main>

  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">JubyDevs</a>.
  </footer>
</body>
</html>
